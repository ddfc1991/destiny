<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDE2">
<meta name="description" content="Destiny · 端侧 AI Agent 控制台，融合 mibot 自托管控制面与 Mika 端侧执行能力">
<title>Destiny · Agent 应用</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="destiny-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="destiny.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div>
      <div class="ttl" id="topTitle">Destiny</div>
      <div class="sub mono" id="topSub">HOME · 状态</div>
    </div>
    <div class="sp"></div>
    <span class="dot" id="topDot"></span>
    <button class="iconbtn" id="btnNew" title="新建会话" aria-label="新建会话">＋</button>
    <button class="iconbtn" id="btnTheme" title="切换主题" aria-label="切换主题">◐</button>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="chat"><span class="gi">✉</span><span>对话</span></button>
    <button class="tab" data-tab="home"><span class="gi">◈</span><span>日程</span></button>
    <button class="tab" data-tab="feed"><span class="gi">◎</span><span>动态</span></button>
    <button class="tab" data-tab="ideas"><span class="gi">✦</span><span>想法</span></button>
    <button class="tab" data-tab="me"><span class="gi">◉</span><span>我的</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="destiny-data.js"></script>
<script src="destiny-core.js"></script>
<script src="destiny-app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
