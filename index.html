<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2EA">
<meta name="description" content="Destiny · 端侧 AI Agent 控制台，融合 mibot 自托管控制面与 Mika 端侧执行能力">
<title>Destiny · Agent 应用</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="destiny-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="destiny.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div>
      <div class="ttl" id="topTitle">Destiny</div>
      <div class="sub mono" id="topSub">HOME · 状态</div>
    </div>
    <div class="sp"></div>
    <span class="dot" id="topDot"></span>
    <button class="iconbtn" id="btnNew" title="新建会话" aria-label="新建会话"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" id="btnTheme" title="切换主题" aria-label="切换主题"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <main class="view" id="view"></main>

  <!-- 常驻输入条：置于滚动容器之外，不遮挡聊天内容；仅对话页显示 -->
  <div class="composer-dock" id="composerDock"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="chat"><span class="ti"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg></span><span>对话</span></button>
    <button class="tab" data-tab="home"><span class="ti"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 2l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-9h6v9"/></svg></span><span>日程</span></button>
    <button class="tab" data-tab="feed"><span class="ti"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15.5 8.5-2.1 5-5 2.1 2.1-5z"/></svg></span><span>动态</span></button>
    <button class="tab" data-tab="ideas"><span class="ti"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 14 9l6.5 2-6.5 2-2 6.5-2-6.5L3.5 11 10 9z"/></svg></span><span>想法</span></button>
    <button class="tab" data-tab="me"><span class="ti"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>我的</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="destiny-data.js"></script>
<script src="destiny-core.js"></script>
<script src="destiny-app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
