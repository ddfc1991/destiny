name: Android Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'scripts/screenshot.sh'
      - '.github/workflows/screenshots.yml'
    branches: [main]

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: 真机截图（KVM 硬件加速）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 system-images;android-35;google_apis;x86_64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          /opt/gradle-8.9/bin/gradle assembleRelease --no-daemon -Pdestiny.shrink=false 2>&1 | tee ../build-reports/screenshot-build.log
          cp app/build/outputs/apk/release/app-release.apk ../apk.apk
          ls -lh ../apk.apk

      - name: Boot emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          script: bash scripts/screenshot.sh shots
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: destiny-screenshots
          path: shots/*.png
          if-no-files-found: warn

      - name: Publish screenshots to repo
        run: |
          set +e
          ls -la shots/ 2>&1 | head -30
          COUNT=$(ls shots/*.png 2>/dev/null | wc -l)
          echo "截图数量: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::没有产生任何截图，跳过回传"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots/*.png
          if git diff --cached --quiet; then
            echo "截图与仓库中的一致，无需提交"
            exit 0
          fi
          git commit -m "chore: 真机截图 (${{ github.sha }})"
          # push 失败不阻断整个 workflow —— artifact 已经拿到了
          git push || echo "::warning::推回仓库失败，但 artifact 里已有截图"
          exit 0

      - name: Publish screenshot logs
        if: always()
        run: |
          set +e
          mkdir -p build-reports
          adb logcat -d -t 400 > build-reports/screenshot-logcat.log 2>&1
          echo "--- exit-info ---" >> build-reports/screenshot-logcat.log
          adb shell dumpsys activity exit-info com.destiny.agent >> build-reports/screenshot-logcat.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-reports/screenshot-logcat.log
          git commit -m "chore: 截图日志" || true
          git push || true
          exit 0
