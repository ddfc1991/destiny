name: Build Web Shell APK

# 说明：这是「网页壳」的备用出包通道，仅手动触发。
# 主线交付物是 build-native-apk.yml 产出的原生 Kotlin 包。
# 本 workflow 全程在隔离的 web-shell/ 目录里跑，不会碰原生工程 android/。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: 网页壳（备用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets (isolated)
        run: |
          mkdir -p web-shell/www
          cp index.html destiny.css destiny-app.js destiny-core.js destiny-data.js destiny-icon.svg manifest.webmanifest sw.js web-shell/www/
          cp capacitor.config.json package.json web-shell/

      - name: Capacitor add / sync android (inside web-shell)
        working-directory: web-shell
        run: |
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Apply Destiny launcher icon
        run: |
          RES=web-shell/android/app/src/main/res
          mkdir -p "$RES/drawable"
          cp android-icons/ic_launcher_background.xml "$RES/drawable/ic_launcher_background.xml"
          cp android-icons/ic_launcher_foreground.xml "$RES/drawable/ic_launcher_foreground.xml"
          for d in "$RES"/mipmap-*; do
            [ -d "$d" ] || continue
            case "$(basename "$d")" in
              mipmap-mdpi) s=48;; mipmap-hdpi) s=72;; mipmap-xhdpi) s=96;;
              mipmap-xxhdpi) s=144;; mipmap-xxxhdpi) s=192;; *) s=192;;
            esac
            [ -f "android-icons/ic_launcher_${s}.png" ] || continue
            for n in ic_launcher ic_launcher_round; do
              [ -f "$d/$n.png" ] && cp "android-icons/ic_launcher_${s}.png" "$d/$n.png"
            done
          done

      - name: Build debug APK
        working-directory: web-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp web-shell/android/app/build/outputs/apk/debug/app-debug.apk Destiny-web-shell.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-web-shell-apk
          path: Destiny-web-shell.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-web-shell-latest
          name: Destiny 网页壳 APK
          body: 网页壳备用包。主线是原生 Kotlin 包（apk-native-latest）。
          files: Destiny-web-shell.apk
          make_latest: false
